<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>apps</title>
    
    <!-- Retro digital font -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'VT323', monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            position: relative;
            touch-action: none; 
        }

        /* Title styling */
        h1 {
            position: absolute;
            top: 8vh;
            width: 100%;
            text-align: center;
            font-size: 4.5rem;
            letter-spacing: 4px;
            font-weight: normal;
            margin: 0;
            pointer-events: none; 
            z-index: 0;
        }

        /* Bubble styling */
        .bubble {
            position: absolute;
            top: 0;
            left: 0;
            width: 260px;
            padding: 18px 25px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 50px;
            font-size: 1.8rem;
            cursor: grab;
            box-sizing: border-box;
            background-color: #000000;
            z-index: 1;
            transition: background-color 0.4s, color 0.4s;
            will-change: transform;
            
            /* Crucial fixes to prevent the browser from hijacking the drag */
            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
            touch-action: none;
        }

        .bubble:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .bubble:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <h1>apps</h1>

    <!-- Added draggable="false" to prevent native browser link-dragging -->
    <a href="https://laser.muetzdesign.com" target="_blank" class="bubble" draggable="false">image to gcode</a>
    <a href="https://mix.muetzdesign.com" target="_blank" class="bubble" draggable="false">key training game</a>
    <a href="https://game.muetzdesign.com" target="_blank" class="bubble" draggable="false">other game</a>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const bubbleElements = document.querySelectorAll('.bubble');
            let activeBubble = null;
            let hasDragged = false;
            let dragStartX = 0, dragStartY = 0;

            const bubbles = Array.from(bubbleElements).map((el, i) => {
                let w = el.offsetWidth;
                let h = el.offsetHeight;
                let startAngle = Math.random() * Math.PI * 2;
                
                return {
                    el: el,
                    w: w,
                    h: h,
                    // Start staggered near the center
                    x: (window.innerWidth / 2) - (w / 2) + (i * 30 - 30),
                    y: (window.innerHeight / 2) - (h / 2) + (i * 100 - 100),
                    // Slower, organic starting velocity
                    vx: Math.cos(startAngle) * 1.0,
                    vy: Math.sin(startAngle) * 1.0,
                    angle: startAngle, 
                    isDragging: false,
                    offsetX: 0,
                    offsetY: 0,
                    lastX: 0,
                    lastY: 0
                };
            });

            // Handle Drag Start
            const startDrag = (e, b) => {
                // Ignore right clicks
                if (e.button === 2) return; 

                let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let clientY = e.touches ? e.touches[0].clientY : e.clientY;

                b.isDragging = true;
                activeBubble = b;
                
                b.offsetX = clientX - b.x;
                b.offsetY = clientY - b.y;
                b.vx = 0;
                b.vy = 0;
                
                dragStartX = clientX;
                dragStartY = clientY;
                hasDragged = false; // Reset drag status on every new click
                
                bubbles.forEach(bub => bub.el.style.zIndex = 1);
                b.el.style.zIndex = 10;
            };

            bubbles.forEach(b => {
                b.el.addEventListener('mousedown', (e) => startDrag(e, b));
                b.el.addEventListener('touchstart', (e) => startDrag(e, b), { passive: false });

                // Link click prevention logic
                b.el.addEventListener('click', (e) => {
                    // If the user moved the mouse during the click, cancel the link redirect
                    if (hasDragged) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                });
            });

            // Handle Drag Move
            const onMove = (clientX, clientY) => {
                if (activeBubble) {
                    activeBubble.x = clientX - activeBubble.offsetX;
                    activeBubble.y = clientY - activeBubble.offsetY;

                    // If moved more than 5 pixels, it's a drag, not a stationary click
                    if (Math.hypot(clientX - dragStartX, clientY - dragStartY) > 5) {
                        hasDragged = true;
                    }
                }
            };

            window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
            window.addEventListener('touchmove', (e) => {
                if (activeBubble) {
                    e.preventDefault();
                    onMove(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: false });

            // Handle Drag End
            const endDrag = () => {
                if (activeBubble) {
                    activeBubble.angle = Math.atan2(activeBubble.vy, activeBubble.vx);
                    activeBubble.isDragging = false;
                    activeBubble = null;
                }
            };

            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchend', endDrag);
            
            // Failsafe: if the mouse leaves the browser window, let go of the bubble
            window.addEventListener('mouseleave', endDrag); 

            // --- THE PHYSICS ENGINE ---
            function update() {
                let screenW = window.innerWidth;
                let screenH = window.innerHeight;

                bubbles.forEach(b => {
                    b.w = b.el.offsetWidth;
                    b.h = b.el.offsetHeight;

                    if (!b.isDragging) {
                        // 1. Organic Steering
                        b.angle += (Math.random() - 0.5) * 0.15; 
                        
                        b.vx += Math.cos(b.angle) * 0.03;
                        b.vy += Math.sin(b.angle) * 0.03;

                        // 2. Regulate speed
                        let speed = Math.hypot(b.vx, b.vy);
                        if (speed > 1.2) {
                            b.vx *= 0.97;
                            b.vy *= 0.97;
                        } else if (speed < 0.6) {
                            b.vx *= 1.03;
                            b.vy *= 1.03;
                        }

                        b.x += b.vx;
                        b.y += b.vy;

                        let bounced = false;
                        // Clean wall bounces
                        if (b.x <= 0) { b.x = 0; b.vx = Math.abs(b.vx); bounced = true; }
                        if (b.x + b.w >= screenW) { b.x = screenW - b.w; b.vx = -Math.abs(b.vx); bounced = true; }
                        if (b.y <= 0) { b.y = 0; b.vy = Math.abs(b.vy); bounced = true; }
                        if (b.y + b.h >= screenH) { b.y = screenH - b.h; b.vy = -Math.abs(b.vy); bounced = true; }
                        
                        if (bounced) {
                            b.angle = Math.atan2(b.vy, b.vx);
                        }
                        
                    } else {
                        // Track mouse speed for throws
                        b.vx = (b.x - b.lastX);
                        b.vy = (b.y - b.lastY);
                        
                        let speed = Math.hypot(b.vx, b.vy);
                        if (speed > 15) {
                            b.vx = (b.vx / speed) * 15;
                            b.vy = (b.vy / speed) * 15;
                        }
                    }

                    b.lastX = b.x;
                    b.lastY = b.y;
                });

                // Bubble-to-Bubble Collisions
                for (let i = 0; i < bubbles.length; i++) {
                    for (let j = i + 1; j < bubbles.length; j++) {
                        let b1 = bubbles[i];
                        let b2 = bubbles[j];

                        let c1x = b1.x + b1.w / 2;
                        let c1y = b1.y + b1.h / 2;
                        let c2x = b2.x + b2.w / 2;
                        let c2y = b2.y + b2.h / 2;

                        let dx = c2x - c1x;
                        let dy = c2y - c1y;

                        let overlapX = (b1.w / 2 + b2.w / 2) - Math.abs(dx);
                        let overlapY = (b1.h / 2 + b2.h / 2) - Math.abs(dy);

                        // If they overlap, cleanly push apart
                        if (overlapX > 0 && overlapY > 0) {
                            if (overlapX < overlapY) {
                                let correction = (overlapX / 2) + 1; 
                                if (dx > 0) {
                                    if (!b1.isDragging) b1.x -= correction;
                                    if (!b2.isDragging) b2.x += correction;
                                } else {
                                    if (!b1.isDragging) b1.x += correction;
                                    if (!b2.isDragging) b2.x -= correction;
                                }
                                let temp = b1.vx;
                                if (!b1.isDragging) b1.vx = b2.vx;
                                if (!b2.isDragging) b2.vx = temp;
                            } else {
                                let correction = (overlapY / 2) + 1;
                                if (dy > 0) {
                                    if (!b1.isDragging) b1.y -= correction;
                                    if (!b2.isDragging) b2.y += correction;
                                } else {
                                    if (!b1.isDragging) b1.y += correction;
                                    if (!b2.isDragging) b2.y -= correction;
                                }
                                let temp = b1.vy;
                                if (!b1.isDragging) b1.vy = b2.vy;
                                if (!b2.isDragging) b2.vy = temp;
                            }
                            
                            // Adjust steering compass to new trajectory
                            if (!b1.isDragging) b1.angle = Math.atan2(b1.vy, b1.vx);
                            if (!b2.isDragging) b2.angle = Math.atan2(b2.vy, b2.vx);
                        }
                    }
                }

                // Apply visual updates to the screen
                bubbles.forEach(b => {
                    b.el.style.transform = `translate3d(${b.x}px, ${b.y}px, 0)`;
                });

                requestAnimationFrame(update);
            }

            // Start engine
            update();
        });
    </script>
</body>
</html>
